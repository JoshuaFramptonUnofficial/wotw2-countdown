<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>05 REVIVE — Update 2.0 | Release Countdown</title>
    <meta name="description" content="Official release countdown for War of the Worlds mod: 05 REVIVE — Update 2.0.">
    <meta name="theme-color" content="#3b0008">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Sound Toggle Button -->
    <button id="sound-toggle" class="sound-toggle audio-muted" type="button" aria-label="Enable sound" aria-pressed="false">
        <svg class="sound-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="none" d="M11 5 6.8 8.5H3v7h3.8L11 19V5Zm4.2 3.1a5.5 5.5 0 0 1 0 7.8M18 5.5a9 9 0 0 1 0 13"/>
        </svg>
    </button>

    <!-- Hidden Visual Debug / Demo Panel -->
    <aside id="demo-panel" class="demo-panel" aria-hidden="true">
        <div class="demo-header">
            <h2>RELEASE DEMO</h2>
            <button id="demo-close" class="demo-close-btn" type="button" aria-label="Hide Menu">✕</button>
        </div>
        <p>Set a test countdown duration to preview weed growth &amp; release transition.</p>
        <div class="demo-time-fields">
            <label>DAYS<input id="demo-days" type="number" min="0" max="99" value="0"></label>
            <label>HOURS<input id="demo-hours" type="number" min="0" max="23" value="0"></label>
            <label>MINUTES<input id="demo-minutes" type="number" min="0" max="59" value="0"></label>
            <label>SECONDS<input id="demo-seconds" type="number" min="0" max="59" value="10"></label>
        </div>
        <div class="demo-actions">
            <button id="demo-run" type="button">RUN COUNTDOWN</button>
            <button id="demo-end" type="button">SHOW END STATE</button>
            <button id="demo-hide" type="button">HIDE MENU</button>
        </div>
    </aside>

    <!-- Background Atmospheric & Haze Layers -->
    <div class="sky-background" aria-hidden="true"></div>
    <div class="haze-layer haze-1" aria-hidden="true"></div>
    <div class="haze-layer haze-2" aria-hidden="true"></div>
    
    <!-- Organic Red Weed Layer with Prop-Style SVG Vines -->
    <div class="weed-container" aria-hidden="true">
        <!-- SVG Creeping Vines (Top, Bottom, Left, Right) -->
        <svg class="vine-svg tendril-top" viewBox="0 0 1000 400" preserveAspectRatio="none">
            <path class="vine-main" d="M -50,-20 Q 200,180 500,120 T 1050,-10 M 150,50 Q 350,220 650,90 T 900,40" />
            <path class="vine-sub" d="M 100,20 Q 250,140 400,80 T 800,20 M 300,110 Q 500,250 700,140 T 950,60" />
            <path class="vine-web" d="M 220,100 C 280,160 340,140 380,90 M 550,130 C 620,200 680,170 740,110" />
        </svg>
        <svg class="vine-svg tendril-bottom" viewBox="0 0 1000 400" preserveAspectRatio="none">
            <path class="vine-main" d="M -50,420 Q 250,200 500,260 T 1050,410 M 100,360 Q 400,160 700,290 T 950,350" />
            <path class="vine-sub" d="M 200,380 Q 450,230 650,310 T 850,370 M 50,330 Q 300,170 550,270 T 800,340" />
            <path class="vine-web" d="M 300,280 C 360,220 420,250 480,300 M 600,240 C 670,180 730,220 780,270" />
        </svg>
        <svg class="vine-svg tendril-left" viewBox="0 0 400 1000" preserveAspectRatio="none">
            <path class="vine-main" d="M -20,-50 Q 180,250 120,500 T -10,1050 M 40,150 Q 220,400 90,700 T 30,900" />
            <path class="vine-sub" d="M 20,100 Q 140,300 80,550 T 10,800 M 80,300 Q 240,550 130,800 T 50,950" />
            <path class="vine-web" d="M 100,280 C 160,340 140,400 90,440 M 130,580 C 190,640 160,700 110,740" />
        </svg>
        <svg class="vine-svg tendril-right" viewBox="0 0 400 1000" preserveAspectRatio="none">
            <path class="vine-main" d="M 420,-50 Q 200,250 260,500 T 410,1050 M 360,100 Q 160,380 290,700 T 350,950" />
            <path class="vine-sub" d="M 380,200 Q 230,450 310,650 T 370,850 M 330,50 Q 170,300 270,550 T 340,800" />
            <path class="vine-web" d="M 280,300 C 220,360 250,420 300,460 M 240,600 C 180,670 220,730 270,780" />
        </svg>
        <div class="weed-vignette"></div>
    </div>

    <!-- Main Content Container -->
    <main class="main-container">
        <!-- Header Title -->
        <header class="title-header">
            <h1 class="main-title">05 REVIVE</h1>
            <h2 class="sub-title">UPDATE 2.0</h2>
        </header>

        <!-- Countdown Display Stage -->
        <section id="countdown-stage" class="countdown-stage">
            <div class="countdown-grid">
                <div class="time-block">
                    <span id="days" class="time-val">00</span>
                    <span class="time-label">DAYS</span>
                </div>
                <div class="time-separator">:</div>
                <div class="time-block">
                    <span id="hours" class="time-val">00</span>
                    <span class="time-label">HOURS</span>
                </div>
                <div class="time-separator">:</div>
                <div class="time-block">
                    <span id="minutes" class="time-val">00</span>
                    <span class="time-label">MINUTES</span>
                </div>
                <div class="time-separator">:</div>
                <div class="time-block">
                    <span id="seconds" class="time-val">00</span>
                    <span class="time-label">SECONDS</span>
                </div>
            </div>
        </section>

        <!-- Download Stage (Revealed at T-0) -->
        <section id="reveal-stage" class="reveal-stage aria-hidden" aria-hidden="true">
            <!-- Overgrown Vine Ring framing the Download Button -->
            <svg class="download-vine-frame" viewBox="0 0 600 220" preserveAspectRatio="none">
                <path class="download-vine-path" d="M 10,110 C 20,20 120,10 300,10 C 480,10 580,20 590,110 C 580,200 480,210 300,210 C 120,210 20,200 10,110 Z" />
                <path class="download-vine-sub" d="M 30,110 C 40,35 140,25 300,25 C 460,25 560,35 570,110 C 560,185 460,195 300,195 C 140,195 40,185 30,110 Z" />
            </svg>
            <a id="download-link" href="https://joshuaframptonunofficial.github.io/wotw-mods/" class="download-btn" target="_blank" rel="noopener noreferrer">
                <span class="btn-glow"></span>
                <span class="btn-text">DOWNLOAD UPDATE 2.0</span>
            </a>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
