<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>05 REVIVE — Update 2.0 | Release Countdown</title>
    <meta name="description" content="Official release countdown for War of the Worlds mod: 05 REVIVE — Update 2.0.">
    <meta name="theme-color" content="#3b0008">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Sound Toggle Button -->
    <button id="sound-toggle" class="sound-toggle audio-muted" type="button" aria-label="Enable sound" aria-pressed="false">
        <svg class="sound-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="none" d="M11 5 6.8 8.5H3v7h3.8L11 19V5Zm4.2 3.1a5.5 5.5 0 0 1 0 7.8M18 5.5a9 9 0 0 1 0 13"/>
        </svg>
    </button>

    <!-- Hidden Visual Debug / Demo Panel -->
    <aside id="demo-panel" class="demo-panel" aria-hidden="true">
        <div class="demo-header">
            <h2>RELEASE DEMO</h2>
            <button id="demo-close" class="demo-close-btn" type="button" aria-label="Hide Menu">✕</button>
        </div>
        <p>Set a test countdown duration to preview weed growth &amp; release transition.</p>
        <div class="demo-time-fields">
            <label>DAYS<input id="demo-days" type="number" min="0" max="99" value="0"></label>
            <label>HOURS<input id="demo-hours" type="number" min="0" max="23" value="0"></label>
            <label>MINUTES<input id="demo-minutes" type="number" min="0" max="59" value="0"></label>
            <label>SECONDS<input id="demo-seconds" type="number" min="0" max="59" value="10"></label>
        </div>
        <div class="demo-actions">
            <button id="demo-run" type="button">RUN COUNTDOWN</button>
            <button id="demo-end" type="button">SHOW END STATE</button>
            <button id="demo-hide" type="button">HIDE MENU</button>
        </div>
    </aside>

    <!-- Background Atmospheric & Haze Layers -->
    <div class="sky-background" aria-hidden="true"></div>
    <div class="haze-layer haze-1" aria-hidden="true"></div>
    <div class="haze-layer haze-2" aria-hidden="true"></div>
    
    <!-- Organic Red Weed Layer with Jagged Branching SVG Tendrils -->
    <div class="weed-container" aria-hidden="true">
        <!-- Top Jagged Vine Cluster -->
        <svg class="vine-svg tendril-top" viewBox="0 0 1000 400" preserveAspectRatio="none">
            <!-- Main Arterial Trunks -->
            <path class="vine-shadow" d="M 50,-10 L 90,80 L 140,120 L 120,190 L 180,240 M 300,-10 L 320,90 L 280,160 L 340,220 M 600,-10 L 570,100 L 630,170 L 590,250 M 850,-10 L 820,110 L 880,180 L 840,260" />
            <path class="vine-main" d="M 50,-10 L 90,80 L 140,120 L 120,190 L 180,240 M 300,-10 L 320,90 L 280,160 L 340,220 M 600,-10 L 570,100 L 630,170 L 590,250 M 850,-10 L 820,110 L 880,180 L 840,260" />
            <!-- Jagged Branch Offshoots & Thorns -->
            <path class="vine-branch" d="M 90,80 L 40,130 L 10,180 M 140,120 L 210,150 L 250,210 M 320,90 L 390,120 L 430,170 M 280,160 L 220,200 L 190,270 M 570,100 L 490,130 L 450,190 M 630,170 L 710,210 L 750,270 M 820,110 L 760,150 L 710,220 M 880,180 L 940,220 L 980,280" />
            <path class="vine-sub" d="M 120,190 L 70,230 L 90,280 M 340,220 L 400,260 L 370,310 M 590,250 L 650,290 L 620,340 M 840,260 L 780,300 L 810,350" />
            <!-- Vascular Capillary Nodes -->
            <path class="vine-web" d="M 140,120 Q 200,90 280,160 M 320,90 Q 450,60 570,100 M 630,170 Q 750,130 820,110" />
        </svg>

        <!-- Bottom Jagged Vine Cluster -->
        <svg class="vine-svg tendril-bottom" viewBox="0 0 1000 400" preserveAspectRatio="none">
            <path class="vine-shadow" d="M 80,410 L 120,320 L 70,270 L 130,190 L 90,130 M 350,410 L 310,310 L 370,230 L 320,150 M 650,410 L 680,300 L 620,220 L 670,140 M 900,410 L 860,300 L 920,230 L 870,150" />
            <path class="vine-main" d="M 80,410 L 120,320 L 70,270 L 130,190 L 90,130 M 350,410 L 310,310 L 370,230 L 320,150 M 650,410 L 680,300 L 620,220 L 670,140 M 900,410 L 860,300 L 920,230 L 870,150" />
            <path class="vine-branch" d="M 120,320 L 180,290 L 220,230 M 70,270 L 10,240 M 310,310 L 240,280 L 200,220 M 370,230 L 440,200 L 480,140 M 680,300 L 750,270 L 790,210 M 620,220 L 550,190 L 510,130 M 860,300 L 790,260 L 750,190 M 920,230 L 980,190" />
            <path class="vine-sub" d="M 130,190 L 190,150 M 320,150 L 260,110 M 670,140 L 730,90 M 870,150 L 810,100" />
            <path class="vine-web" d="M 70,270 Q 180,320 310,310 M 370,230 Q 500,260 620,220 M 680,300 Q 780,330 860,300" />
        </svg>

        <!-- Left Jagged Vine Cluster -->
        <svg class="vine-svg tendril-left" viewBox="0 0 400 1000" preserveAspectRatio="none">
            <path class="vine-shadow" d="M -10,80 L 110,130 L 160,90 L 230,160 M -10,350 L 100,320 L 170,380 L 240,330 L 290,390 M -10,650 L 120,610 L 180,680 L 250,620 M -10,880 L 90,830 L 160,890 L 220,840" />
            <path class="vine-main" d="M -10,80 L 110,130 L 160,90 L 230,160 M -10,350 L 100,320 L 170,380 L 240,330 L 290,390 M -10,650 L 120,610 L 180,680 L 250,620 M -10,880 L 90,830 L 160,890 L 220,840" />
            <path class="vine-branch" d="M 110,130 L 140,200 L 190,240 M 170,380 L 210,450 L 260,490 M 120,610 L 150,540 L 200,500 M 160,890 L 210,940" />
            <path class="vine-sub" d="M 230,160 L 280,210 M 290,390 L 340,430 M 250,620 L 310,660 M 220,840 L 270,880" />
            <path class="vine-web" d="M 160,90 Q 120,220 100,320 M 170,380 Q 140,500 120,610 M 180,680 Q 140,770 90,830" />
        </svg>

        <!-- Right Jagged Vine Cluster -->
        <svg class="vine-svg tendril-right" viewBox="0 0 400 1000" preserveAspectRatio="none">
            <path class="vine-shadow" d="M 410,100 L 290,140 L 240,90 L 170,170 M 410,380 L 300,340 L 230,400 L 160,340 L 110,410 M 410,680 L 280,630 L 220,700 L 150,630 M 410,900 L 310,850 L 240,910 L 180,850" />
            <path class="vine-main" d="M 410,100 L 290,140 L 240,90 L 170,170 M 410,380 L 300,340 L 230,400 L 160,340 L 110,410 M 410,680 L 280,630 L 220,700 L 150,630 M 410,900 L 310,850 L 240,910 L 180,850" />
            <path class="vine-branch" d="M 290,140 L 260,210 L 210,250 M 230,400 L 190,470 L 140,510 M 280,630 L 250,560 L 200,520 M 240,910 L 190,960" />
            <path class="vine-sub" d="M 170,170 L 120,220 M 110,410 L 60,450 M 150,630 L 90,670 M 180,850 L 130,890" />
            <path class="vine-web" d="M 240,90 Q 280,220 300,340 M 230,400 Q 260,520 280,630 M 220,700 Q 260,790 310,850" />
        </svg>

        <div class="weed-vignette"></div>
    </div>

    <!-- Main Content Container -->
    <main class="main-container">
        <!-- Header Title -->
        <header id="title-header" class="title-header">
            <h1 class="main-title">05 REVIVE</h1>
            <h2 class="sub-title">UPDATE 2.0</h2>
        </header>

        <!-- Countdown Display Stage -->
        <section id="countdown-stage" class="countdown-stage">
            <div class="countdown-grid">
                <div class="time-block">
                    <span id="days" class="time-val">00</span>
                    <span class="time-label">DAYS</span>
                </div>
                <div class="time-separator">:</div>
                <div class="time-block">
                    <span id="hours" class="time-val">00</span>
                    <span class="time-label">HOURS</span>
                </div>
                <div class="time-separator">:</div>
                <div class="time-block">
                    <span id="minutes" class="time-val">00</span>
                    <span class="time-label">MINUTES</span>
                </div>
                <div class="time-separator">:</div>
                <div class="time-block">
                    <span id="seconds" class="time-val">00</span>
                    <span class="time-label">SECONDS</span>
                </div>
            </div>
        </section>

        <!-- Download Stage (Revealed at T-0 with clean stage, zero text overlap) -->
        <section id="reveal-stage" class="reveal-stage aria-hidden" aria-hidden="true">
            <a id="download-link" href="https://joshuaframptonunofficial.github.io/wotw-mods/" class="download-btn" target="_blank" rel="noopener noreferrer">
                <span class="btn-glow"></span>
                <span class="btn-text">DOWNLOAD UPDATE 2.0</span>
            </a>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
